# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-path"
version = "0.1.0"
description = "List the paths by which untrusted input can reach secrets and publishing credentials in GitHub Actions workflows."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
keywords = ["github-actions", "security", "secrets", "ci", "supply-chain", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/jacob-adm/trust-path"
Documentation = "https://github.com/jacob-adm/trust-path/tree/main/docs"
Source = "https://github.com/jacob-adm/trust-path"
Issues = "https://github.com/jacob-adm/trust-path/issues"

[project.scripts]
trust-path = "trust_path.cli:main"

[tool.setuptools]
packages = ["trust_path"]

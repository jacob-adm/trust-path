# An agent that holds nothing: no secret, no token scope. Nothing to report.
name: no-credential
on:
  issues:
    types: [opened]
permissions: {}
jobs:
  summarise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/ai-inference@v1
        with:
          prompt: Summarise issue ${{ github.event.issue.number }}.

# The action's default gate, and a sandbox that can write the workspace.
name: codex-gated
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
jobs:
  assist:
    runs-on: ubuntu-latest
    steps:
      - uses: openai/codex-action@v1
        with:
          prompt: Help with issue ${{ github.event.issue.number }}.
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write

# The action has no gate of its own and the workflow adds none.
name: gemini
on:
  issue_comment:
    types: [created]
permissions:
  id-token: write
  issues: write
jobs:
  assist:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          prompt: Help with issue ${{ github.event.issue.number }}.
